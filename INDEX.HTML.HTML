<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Rose Day 💖</title>
<style>
    body {
        margin: 0;
        font-family: 'Comic Sans MS', cursive, sans-serif;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        text-align: center;
        color: #fff;
        overflow: hidden;
    }

    h1 {
        margin-top: 40px;
        font-size: 40px;
        animation: glow 2s infinite alternate;
    }

    @keyframes glow {
        from { text-shadow: 0 0 10px #fff; }
        to { text-shadow: 0 0 25px #ff4da6; }
    }

    .bear {
        font-size: 90px;
        margin: 20px;
        transition: transform 0.5s;
    }

    .buttons button {
        padding: 12px 25px;
        margin: 10px;
        border: none;
        border-radius: 25px;
        font-size: 18px;
        cursor: pointer;
        background: #fff;
        color: #ff4da6;
        font-weight: bold;
        transition: 0.3s;
    }

    .buttons button:hover {
        transform: scale(1.1);
        background: #ff4da6;
        color: white;
    }

    #message {
        font-size: 24px;
        margin-top: 20px;
        min-height: 60px;
    }

    /* Floating Hearts */
    .hearts {
        position: fixed;
        bottom: -10px;
        font-size: 20px;
        animation: floatUp 5s linear infinite;
    }

    @keyframes floatUp {
        0% { transform: translateY(0); opacity: 1; }
        100% { transform: translateY(-800px); opacity: 0; }
    }

    /* Falling Roses */
    .rose {
        position: fixed;
        top: -50px;
        font-size: 24px;
        animation: fall 7s linear infinite;
    }

    @keyframes fall {
        0% { transform: translateY(0) rotate(0deg); opacity: 1; }
        100% { transform: translateY(900px) rotate(360deg); opacity: 0; }
    }

    audio {
        position: fixed;
        bottom: 10px;
        left: 10px;
    }
</style>
</head>
<body>

<h1>🌹 Happy Rose Day 🌹</h1>

<div class="bear" id="bear">🐻🌹</div>

<div id="message">Do you love me, Rachana ji? 💖</div>

<div class="buttons">
    <button onclick="sayYes()">YES 💘</button>
    <button onclick="sayNo()">NO 💔</button>
</div>

<!-- Background Music (replace with your own song link if you want) -->
<audio controls autoplay loop>
    <source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3" type="audio/mpeg">
</audio>

<script>
let step = 0;

function sayNo() {
    const bear = document.getElementById("bear");
    const msg = document.getElementById("message");

    bear.innerHTML = "🐻😢";
    bear.style.transform = "scale(1.2)";
    msg.innerHTML = "Don’t you love me? 🥺💔";
}

function sayYes() {
    const bear = document.getElementById("bear");
    const msg = document.getElementById("message");

    step++;

    if (step === 1) {
        bear.innerHTML = "🐻💖";
        msg.innerHTML = "Sure? Do you really love me? 💘";
    } 
    else if (step === 2) {
        bear.innerHTML = "🐻💓";
        msg.innerHTML = "Sure Rachana ji? 😊💕";
    } 
    else if (step === 3) {
        bear.innerHTML = "🐻❤️";
        msg.innerHTML = "You said YES! I love you! 💖💖";
    } 
    else {
        bear.innerHTML = "🐻😁🌹";
        msg.innerHTML = "Happy Rose Day my love, Rachana ji! 🌹💞 I love you Badarni 😊🐻";
        createHearts();
        startFallingRoses();
    }
}

function createHearts() {
    setInterval(() => {
        const heart = document.createElement("div");
        heart.classList.add("hearts");
        heart.style.left = Math.random() * window.innerWidth + "px";
        heart.innerHTML = "💖";
        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 5000);
    }, 300);
}

function startFallingRoses() {
    setInterval(() => {
        const rose = document.createElement("div");
        rose.classList.add("rose");
        rose.style.left = Math.random() * window.innerWidth + "px";
        rose.innerHTML = "🌹";
        document.body.appendChild(rose);

        setTimeout(() => rose.remove(), 7000);
    }, 400);
}
</script>

</body>
</html>
